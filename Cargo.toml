[package]
name = "fluffy"
version = "0.1.0"
edition = "2024"
build = "build.rs"
license = "MIT"


[[bin]]
name = "fluffy"
path = "src/main.rs"

[[bin]]
name = "fluffy-settings"
path = "src/bin/fluffy-settings.rs"
required-features = ["gui"]

[[bin]]
name = "fluffy-bench"
path = "src/bin/fluffy-bench.rs"

[features]
default = []
gui = ["dep:libcosmic", "dep:tokio", "dep:rfd"]

[dependencies]
smithay-client-toolkit = { version = "0.21.1", default-features = false, features = ["calloop", "pkg-config", "xkbcommon"] }
wayland-client = { version = "0.31.15", features = ["system"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
gstreamer = { version = "0.25.4", features = ["v1_28"] }
gstreamer-video = { version = "0.25.4", features = ["v1_28"] }
ctrlc = "3.4"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
rustix = { version = "1.0", features = ["process"] }

# Optional GUI dependencies (strictly isolated from resident daemon)
libcosmic = { git = "https://github.com/pop-os/libcosmic", default-features = false, features = [
    "autosize",
    "tokio",
    "wayland",
    "winit",
], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }
rfd = { version = "0.15", optional = true }
