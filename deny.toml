[licenses]
confidence-threshold = 0.9

allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

unused-allowed-license = "warn"


[advisories]
yanked = "warn"
unmaintained = "all"
unsound = "all"


[bans]
multiple-versions = "warn"
wildcards = "deny"


[sources]
unknown-registry = "deny"
unknown-git = "deny"